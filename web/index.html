<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/startcloud.svg" />
    <title>STARTcloud Provisioner Catalog</title>
    <meta
      name="description"
      content="Provisioner packages for hyperweaver-agent and zoneweaver-agent — public catalog plus per-organization private catalogs."
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('catalog.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-bs-theme', theme);
          var lang = localStorage.getItem('i18nextLng');
          if (lang) {
            document.documentElement.lang = lang;
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
