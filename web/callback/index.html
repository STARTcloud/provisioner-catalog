<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var session = JSON.parse(localStorage.getItem('user') || 'null');
          var preference =
            (session && session.preferredTheme) || localStorage.getItem('theme') || 'auto';
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = localStorage.getItem('i18nextLng');
          if (lang) {
            document.documentElement.lang = lang;
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/startcloud.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing in… — STARTcloud Provisioner Catalog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/callback.jsx"></script>
  </body>
</html>
